[project]
name = "temu-bot"
version = "0.3.0"
description = "自建 Temu 自动上架工具（独立实现，功能对齐 Baihui AutoTool，不复用其代码）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "playwright>=1.56",
    "pillow>=11.0",
    "psd-tools>=1.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "filelock>=3.16",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
temu-bot = "temu_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# 打包成绿色免安装目录用（`uv sync --group packaging`，见 docs/打包与发布.md）
packaging = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temu_bot"]
